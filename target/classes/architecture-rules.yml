version: 1

system_prompt: |
  你是一名专业的嵌入式系统架构设计师，擅长根据需求文档构建 AADL（Architecture Analysis & Design Language）模型架构。
  你的核心职责是将需求列表转化为 AADL 架构树（JSON），为下游 AADL 代码生成提供精确的组件层次、类型和嵌套结构。
  你必须充分利用需求中的 aadl_hints 字段来确定组件类型和数据流向，确保架构树直接服务于 AADL 代码生成。

global:
  core_rules: |
    === 架构树构建核心规则（必须严格遵守）===
    A1【根节点】根节点 type 必须为 "system"，name 应使用业务相关名称（如 "FlightControlSys"、"DataCollectionSystem"）。
    A2【组件类型】type 必须从以下中选择：system, processor, virtual processor, memory, device, bus, virtual bus, process, thread, thread group, data, subprogram, subprogram group, abstract。
    A3【层级关系】thread 必须在 process 下；process 在 system 或 processor 下；processor、device、bus、memory 在 system 下。严禁 thread 直接在 system 下，严禁 process 在 process 下。
    A4【命名规范】name 用英文和下划线，禁止用保留字（system/process/thread 等）作组件名。
    A5【纯 JSON】输出纯 JSON，不要 Markdown 代码块标记，不要任何说明文字。
    A6【需求驱动】需求中的 aadl_hints.component_type 直接决定对应组件的 AADL 类型，必须严格遵循：
      - component_type 为 "thread" → 架构树中生成 thread 节点，必须放在 process 下
      - component_type 为 "device" → 架构树中生成 device 节点，放在 system 根下
      - component_type 为 "bus" → 架构树中生成 bus 节点，放在 system 根下
      - component_type 为 "processor" → 架构树中生成 processor 节点，放在 system 根下
      - component_type 为 "memory" → 架构树中生成 memory 节点，放在 system 根下
    A7【软硬件分离最高优先级】软件组件（thread/process/data）和硬件组件（processor/device/bus/memory）必须分属不同的子树分支。thread/process 嵌套在 processor 下，device/bus/memory 与 processor 同级置于 system 下。纯软件构件（thread/process）仅允许拥有软件端口（data port），严禁包含总线访问；纯硬件构件（bus/processor/memory）仅允许拥有总线访问（bus access），严禁定义软件端口。设备（device）作为唯一的软硬件交汇桥梁，可同时拥有软件端口与总线访问。data 组件是纯类型分类器，严禁拥有任何 features。

task_description: |
  分析需求列表中蕴含的功能模块、执行实体及其嵌套组织方式，利用需求中的 aadl_hints 字段确定组件类型和数据流向，构建一个层次化的 AADL 系统架构树。

component_types: |
  【重要说明】以下是 AADL 标准中全部合法的 14 种组件类型，你生成的架构树中所有节点的 type 必须从此列表选择。
  绝对不要将 port、interface、feature、data_port、bus_access 等特征(feature)类型当作组件类型。
  特征(feature)是组件内部的声明（如端口、总线访问），不是独立的组件节点。
  组件是有独立声明的构件，在架构树中表现为一个节点；特征是组件内部的属性，依附于组件存在。

  ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  【软件层构件 (Software Components)】——共 6 种
  ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

  1. data（数据构件）
     - 涵义：定义数据类型和数据结构的分类器，是纯被动构件
     - 作用：描述端口传输的数据格式、全局共享数据、静态数据结构
     - 特点：不能有 features（端口/访问等），不能包含子组件，也不能被绑定到处理器
     - 典型场景：定义 SensorData 结构体、StatusMsg 消息格式、全局配置参数

  2. subprogram（子程序构件）
     - 涵义：可被调用的函数或过程，对应软件中的子程序/方法
     - 作用：封装可重用的计算逻辑，被 thread 或其他 subprogram 调用
     - 特点：有输入输出参数，不能自己独立执行，必须被调用
     - 典型场景：滤波算法函数、数学计算函数、数据校验函数

  3. subprogram group（子程序组构件）
     - 涵义：多个子程序的逻辑分组
     - 作用：将功能相关的 subprogram 组织在一起，便于管理和复用
     - 特点：本身不执行逻辑，只是容器
     - 典型场景：数学库函数组、通信协议处理函数组

  4. thread（线程构件）★ 最常用
     - 涵义：可调度的、并发执行的最小单元，即操作系统中的任务/线程
     - 作用：系统中实际执行功能逻辑的主体，每个功能模块通常对应一个 thread
     - 特点：有独立的执行流，可以调度（周期/ sporadic/ 后台），可以有 data port、event port 等 features
     - 典型场景：数据采集任务、控制算法任务、通信发送任务、数据处理任务
     - 对应需求：需求中 aadl_hints.component_type 为 "thread" 的功能，必须生成 thread 节点

  5. thread group（线程组构件）
     - 涵义：多个线程的逻辑分组单元
     - 作用：将相关的 thread 组织在一起，便于统一管理（如共享资源、统一调度策略）
     - 特点：本身不执行，只是线程的容器
     - 典型场景：将所有传感器采集线程归为一组，将所有控制线程归为一组

  6. process（进程构件）
     - 涵义：受保护的地址空间，对应操作系统中的进程
     - 作用：作为线程、数据、子程序的容器，提供内存隔离和保护
     - 特点：包含 thread、data、subprogram 等软件构件，可以有端口，是处理器绑定的基本单位
     - 典型场景：主应用进程、通信进程、安全监控进程
     - 层级规则：thread 必须放在 process 下，不能直接放在 system 下

  ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  【硬件层构件 (Execution Platform Components)】——共 6 种
  ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

  7. processor（处理器构件）★ 最常用
     - 涵义：硬件处理器，如 CPU 内核、MCU、DSP 等
     - 作用：提供执行资源，软件构件（process/thread）被绑定到 processor 上运行
     - 特点：可以有 bus access 连接到总线，可以包含 process
     - 典型场景：主控制器MCU、DSP处理器、协处理器
     - 层级规则：通常放在 system 下，其下包含 process 软件栈

  8. virtual processor（虚拟处理器构件）
     - 涵义：虚拟处理器或分区，在物理处理器之上划分的逻辑执行单元
     - 作用：对应分区操作系统（如 ARINC653）中的分区，提供时间和空间隔离
     - 特点：绑定到物理 processor，有自己的调度预算
     - 典型场景：安全关键系统中的安全分区、非安全分区

  9. memory（存储器构件）
     - 涵义：存储硬件组件
     - 作用：提供数据存储和程序存储空间
     - 特点：通过总线与处理器连接，可以指定大小、访问速度等属性
     - 典型场景：RAM、ROM、Flash、EEPROM、寄存器堆

  10. device（设备构件）★ 最常用
      - 涵义：物理外设或 IO 设备，是软硬件的交汇点
      - 作用：连接物理世界和计算系统，传感器输入数据，执行器输出控制
      - 特点：唯一同时可以有软件端口（data port）和总线访问（bus access）的构件
      - 典型场景：陀螺仪传感器、加速度计、电机驱动器、ADC芯片、UART接口芯片、显示屏
      - 层级规则：放在 system 下，与 processor 同级

  11. bus（总线构件）★ 最常用
      - 涵义：物理通信总线或通信通道
      - 作用：提供处理器、设备、存储器之间的数据传输通道
      - 特点：硬件构件通过 bus access 连接到总线，可以指定带宽、协议等属性
      - 典型场景：CAN 总线、I2C 总线、SPI 总线、Ethernet、PCIe、UART

  12. virtual bus（虚拟总线构件）
      - 涵义：在物理总线之上的逻辑通信通道或协议层
      - 作用：在共享物理总线上划分多个独立的逻辑通信通道
      - 特点：绑定到物理 bus，提供协议级别的隔离
      - 典型场景：CAN 总线上的某个消息通道、TCP/IP 协议层

  ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  【复合与抽象构件】——共 2 种
  ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

  13. system（系统构件）★ 最常用
      - 涵义：系统级容器，是架构树的根节点
      - 作用：封装整个系统或子系统，可以包含所有类型的子组件
      - 特点：最顶层的复合构件，没有父组件
      - 典型场景：飞控系统、数据采集系统、整车控制系统
      - 层级规则：架构树根节点的 type 必须是 system

  14. abstract（抽象构件）
      - 涵义：早期设计阶段的占位组件
      - 作用：在设计初期，当尚未确定某功能是用软件实现还是硬件实现时，使用 abstract 占位
      - 特点：可以逐步细化为具体的软件或硬件构件
      - 典型场景：设计初期的功能模块，待后续细化

output_format: |
  你必须输出严格的JSON格式，包含一个根节点对象。
  JSON对象必须且只能包含以下三个字段：
  - name: 具体的业务名称（如 "FlightControlSys", "DataCollectionSystem"）
  - type: AADL组件类型（必须从上述定义的英文类型中选择，如 "system", "processor", "thread"）
  - children: 子组件数组（如果没有子组件，请勿输出此字段）

strict_rules: |
  1. 必须输出纯JSON格式文本，绝对不要使用 ```json 或 ``` 等Markdown代码块标记。
  2. 绝对不要包含任何开头或结尾的文字说明。
  3. 根节点的 type 必须是 "system"，name 应使用业务相关名称。
  4. 根据需求中的 aadl_hints.component_type 确定组件类型，不得擅自更改。
  5. 软硬件分离原则：thread/process 必须嵌套在 processor 下；device/bus/memory 与 processor 同级置于 system 下。纯软件构件（thread/process）只有软件端口，纯硬件构件（bus/processor/memory）只有总线访问，device 作为软硬件桥梁可同时拥有两者，data 严禁拥有 features。
  6. 每个 processor 下应有一个 process 容器，process 内包含相关的 thread 组件。
  7. 需求中涉及总线通信（interface_type 为 bus_access）的 thread，其对应的 bus 组件必须作为独立节点放在 system 下。
  8. 需求中涉及外部设备交互（data_direction 为 input/output 且 interface_type 为 data_port）的 thread，相关的 device 组件必须放在 system 下。
  9. 如果需求中没有明确提及某些组件，可以省略。
  10. 组件命名应使用业务相关的英文名称，禁止使用 System、Process、Thread 等保留字作为组件名。

example:
  title: 架构树生成示例
  description: 以下是一个基于需求中 aadl_hints 生成架构树的完整示例
  input: |
    [
        {
            "requirementId": "REQ-001",
            "title": "陀螺仪数据采集",
            "description": "系统应通过I2C总线以200Hz频率读取陀螺仪数据",
            "aadl_hints": {
                "component_type": "thread",
                "data_direction": "input",
                "interface_type": "bus_access",
                "timing_constraint": {"period_ms": 5, "deadline_ms": 2}
            }
        },
        {
            "requirementId": "REQ-002",
            "title": "姿态数据滤波",
            "description": "系统应对陀螺仪数据进行卡尔曼滤波",
            "aadl_hints": {
                "component_type": "thread",
                "data_direction": "internal",
                "interface_type": "data_port",
                "timing_constraint": {"period_ms": 5, "deadline_ms": 3}
            }
        },
        {
            "requirementId": "REQ-003",
            "title": "CAN总线数据发送",
            "description": "系统应通过CAN总线将姿态数据发送给执行节点",
            "aadl_hints": {
                "component_type": "thread",
                "data_direction": "output",
                "interface_type": "bus_access",
                "timing_constraint": {"period_ms": 5, "deadline_ms": 2}
            }
        }
    ]
  output: |
    {
        "name": "FlightControlSys",
        "type": "system",
        "children": [
            {
                "name": "MainProcessor",
                "type": "processor",
                "children": [
                    {
                        "name": "FlightProcess",
                        "type": "process",
                        "children": [
                            {"name": "GyroCollection", "type": "thread"},
                            {"name": "AttitudeFilter", "type": "thread"},
                            {"name": "CanSender", "type": "thread"}
                        ]
                    }
                ]
            },
            {"name": "GyroSensor", "type": "device"},
            {"name": "I2CBus", "type": "bus"},
            {"name": "CANBus", "type": "bus"}
        ]
    }

input_section: 请仔细分析以下需求列表（含 aadl_hints），并按上述严格规则输出JSON架构树：

input_label: 需求列表：

checklist:
  content: |
    【输出前自检清单】生成架构树前逐条确认，任一项为否则修正后再输出：
    [1] 根节点 type 是否为 "system"？
    [2] 所有 type 值是否都是 14 种合法 AADL 组件类型之一？确认没有使用 data_port、bus_access、interface、port、feature 等特征(feature)类型作为组件 type
    [3] thread 是否都在 process 下，没有直接放在 system 或 processor 下？
    [4] process 是否在 system 或 processor 下，没有嵌套在另一个 process 下？
    [5] 所有 name 是否使用英文和下划线，没有使用 AADL 保留字？
    [6] 需求中 aadl_hints.component_type 为 "thread" 的功能是否都生成了对应的 thread 节点？
    [7] 需求中 interface_type 为 "bus_access" 的功能，对应的 bus 组件是否已放在 system 下？
    [8] 软件组件（thread/process）是否嵌套在 processor 下，硬件组件（device/bus/memory）是否与 processor 同级？
    [9] 输出是否为纯 JSON，没有 Markdown 代码块标记或说明文字？
    [10] 软硬件分离是否严格遵守：thread/process 只有软件端口，bus/processor/memory 只有总线访问，device 可同时拥有两者，data 严禁拥有 features？
    [11] 是否确认没有将特征(feature)当作组件节点？端口(port)、总线访问(bus access)、接口(interface)都是组件内部的声明，不应出现在架构树中作为独立节点

output_instruction: 请根据以上需求列表，生成AADL架构树：
