server:
  port: 8080
  tomcat:
    uri-encoding: UTF-8

spring:
  application:
    name: aadl-agent
  http:
    encoding:
      charset: UTF-8
      enabled: true
      force: true

file:
  input-path: ./input
  output-path: ./output

ollama:
  base-url: http://localhost:11434
  chat-model: qwen3:8b
  embedding-model: qwen3-embedding:latest
  timeout: 900000

# DeepSeek API 配置（API Key 请自行填写）
deepseek:
  api-key: ""
  base-url: https://api.deepseek.com
  chat-model: deepseek-v4-flash
  embedding-model: deepseek-embedding
  timeout: 600000

# 豆包（字节跳动火山引擎）API 配置（API Key 请自行填写）
doubao:
  api-key: ""
  base-url: https://ark.cn-beijing.volces.com/api/v3
  chat-model: ""
  embedding-model: ""
  timeout: 600000

# ChatGPT (OpenAI) API 配置（API Key 请自行填写）
chatgpt:
  api-key: ""
  base-url: https://api.openai.com/v1
  chat-model: gpt-4o-mini
  embedding-model: text-embedding-3-small
  timeout: 600000

# Google Gemini API 配置（API Key 请自行填写）
gemini:
  api-key: ""
  base-url: https://generativelanguage.googleapis.com/v1
  chat-model: gemini-2.0-flash
  embedding-model: text-embedding-004
  timeout: 600000

rag:
  top-k: 5
  rerank-top-k: 3
  rrf-k: 60

qdrant:
  host: localhost
  port: 6333
  embedding-size: 4096

agent:
  requirement:
    max-retries: 3
    temperature: 0.1
    max-tokens: 8192
    chunk-size: 8000
    overlap-percent: 15
    direct-process-threshold: 10000
    parallel-pool-size: 3
  architecture:
    max-retries: 3
    temperature: 0.1
    max-tokens: 8192
  module:
    max-retries: 3
    temperature: 0.1
    max-tokens: 8192
  aadl:
    max-retries: 3
    temperature: 0.1
    max-tokens: 16384
  aadl-fixer:
    max-retries: 3
    temperature: 0.1
    max-tokens: 16384
  rewrite:
    model-type: OLLAMA
    ollama-model-name: "qwen3:8b"
    temperature: 0.3
    max-tokens: 512