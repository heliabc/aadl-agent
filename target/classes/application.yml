server:
  port: 8080
  tomcat:
    uri-encoding: UTF-8

spring:
  application:
    name: aadl-agent
  http:
    encoding:
      charset: UTF-8
      enabled: true
      force: true

file:
  input-path: ./input
  output-path: ./output

ollama:
  base-url: http://localhost:11434
  chat-model: deepseek-coder-v2:16b
  embedding-model: qwen3-embedding:latest
  timeout: 900000

# DeepSeek API 配置（API Key 请自行填写）
deepseek:
  api-key: "sk-2a3bfd0185a6426c89bf9610f60abd54"
  base-url: https://api.deepseek.com
  chat-model: deepseek-chat
  timeout: 600000

# 豆包（字节跳动火山引擎）API 配置（API Key 请自行填写）
doubao:
  api-key: "57cf121a-0404-422b-a45f-b35b4dc1d5f7"
  base-url: https://ark.cn-beijing.volces.com/api/v3
  chat-model: "doubao-seed-2-1-pro-260628"
  timeout: 600000

# ChatGPT (OpenAI) API 配置（API Key 请自行填写）
chatgpt:
  api-key: ""
  base-url: https://api.openai.com/v1
  chat-model: gpt-4o-mini
  timeout: 600000

# Google Gemini API 配置（API Key 请自行填写）
gemini:
  api-key: ""
  base-url: https://generativelanguage.googleapis.com/v1
  chat-model: gemini-2.0-flash
  timeout: 600000

rag:
  top-k: 5
  rerank-top-k: 3
  rrf-k: 60

qdrant:
  host: localhost
  port: 6333
  embedding-size: 4096

agent:
  requirement:
    max-retries: 3
    temperature: 0.1
    max-tokens: 8192
    chunk-size: 8000
    overlap-percent: 15
    direct-process-threshold: 10000
    parallel-pool-size: 3
  architecture:
    max-retries: 3
    temperature: 0.1
    max-tokens: 8192
  module:
    max-retries: 3
    temperature: 0.1
    max-tokens: 16384
  aadl:
    max-retries: 3
    temperature: 0.1
    max-tokens: 16384
  aadl-fixer:
    max-retries: 3
    temperature: 0.1
    max-tokens: 16384
  rewrite:
    model-type: OLLAMA
    ollama-model-name: "qwen3:8b"
    temperature: 0.3
    max-tokens: 512