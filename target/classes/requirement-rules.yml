input_section: 请仔细阅读以下需求分析文档，并按照上述格式输出条目化的需求列表。

input_label: 需求分析文档：

checklist:
  content: |
    【输出前自检清单】生成需求列表前逐条确认，任一项为否则修正后再输出：
    [1] 每个需求的 requirementId 是否唯一且格式正确（REQ-XXX）？
    [2] 每个需求的 acceptanceCriteria 是否至少有 2 条可衡量的验收标准？
    [3] dependencies 中引用的需求ID是否都存在？
    [4] 每条需求是否都填写了 aadl_hints，且 component_type 字段不为空？
    [5] 周期性任务的 timing_constraint.period_ms 是否已填写？
    [6] 涉及硬件交互的需求，data_direction 是否为 input 或 output？
    [7] 输出是否为纯 JSON，没有 Markdown 代码块标记或说明文字？

output_instruction: 请根据以上需求分析文档，生成面向AADL建模的条目化需求列表：
