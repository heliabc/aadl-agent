            },
            {
              "name": "FlightControlSoftware",
              "type": "system",
              "description": "飞行控制软件",
              "features": [],
              "subcomponents": [
                {
                  "name": "AttitudeControlProcess",
                  "type": "process",
                  "description": "姿态控制进程",
                  "features": [
                    {"name": "sensor_data_in", "kind": "data_port", "direction": "in", "data_type": "SensorData"},
                    {"name": "control_out", "kind": "data_port", "direction": "out", "data_type": "ControlSignal"}
