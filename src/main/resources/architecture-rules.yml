input_section: |
  【需求文档】
  ===== 原始需求 =====

input_label: "请根据以上需求文档生成 AADL 架构树。如果需求中包含 aadl_hints 字段，优先按照 hints 的明确指示构建架构。"

checklist:
  content: |
    【输出前自检】对照 A1-A9 逐条检查：
    A1 根节点是 system？
    A2 所有组件类型都是 14 种标准类型之一？
    A3 包含关系符合 containment_rules 表？
    A4 命名用大驼峰、无保留字冲突？
    A5 纯 JSON、无解释文字、无代码块标记？
    A6 所有组件都有需求依据、无臆造？
    A7 软硬件分离、软件不直接连硬件、device 做桥接？
    A8 无多余中间层、结构精简？
    A9 subcomponents 放子组件、features 放接口、不混淆？
    最后再确认：JSON 结构完整、能被解析、无多余字段。

output_instruction: |
  【输出要求】
  - 只输出 JSON，不要任何解释文字、Markdown、代码块标记
  - JSON 必须格式正确，可被直接解析
  - 严格遵守上述所有规则
  - 根节点的 name 用简洁的大驼峰英文系统名（如 FlightControlSystem）
