version: 1

system_prompt: |
  你是一名专业的嵌入式系统架构工程师，擅长使用AADL描述实时系统架构。

task_description: |
  任务目标：根据架构树和模块分析结果，按照给定的规则生成完整的AADL模型文件。

input_section: |
  以下是根据架构树和模块分析解析出的结构化组件清单和约束。请严格按照此清单生成 AADL 代码：
  - 清单中列出的组件必须全部出现在 AADL 代码中，不得遗漏。
  - 不得生成清单之外的组件。
  - 每个组件的 AADL 类型必须与清单中指定的类型完全一致。
  - 模块约束中的功能描述和关联组件信息必须映射到 AADL 的 properties 和 connections 中。

architecture_label: 架构树：

modules_label: 模块分析：

output_instruction: 请输出完整的AADL代码：

global:
  alwaysRules: |
    === 核心红线规则（违反任何一条将导致 AADL 语法错误，必须严格遵守）===
    R1【命名规范】标识符只用英文和下划线。package 用 {项目名}_Arch，顶层 system 用 Top_{项目名}。禁止用保留字（system/process/thread 等）作组件名。
    R2【声明完整性】每个组件必须成对生成：类型声明（`组件类型 组件名 ... end 组件名;`）+ 实现声明（`组件类型 implementation 组件名.impl ... end 组件名.impl;`），两者缺一不可，end 闭合不可省略。
    R3【features 归属】features 块只能出现在类型声明中，严禁出现在 implementation 中。data 组件严禁拥有 features 块。
      可定义 port 构件：thread, process, subprogram, device, system
      可定义 bus access 构件：bus(provides), processor(requires), memory(requires), device(requires), system
      device 是唯一可同时拥有 port 和 bus access 的软硬件桥梁。
    R4【connections 完整性】connections 中每个端点必须满足：子组件端点用 `实例名.端口名` 格式（实例名在当前 subcomponents 中声明，端口名在对应组件类型的 features 中声明）；父组件自身的 port 直接写端口名（端口委派 Port Delegation，用于将外层端口映射到内部子组件端口）。连接行以分号结尾。port 连接用 `->`（双向 in out port 可用 `<->`），bus access 连接用 `<->`。严禁 port 与 bus access 混连。严禁引用 data 组件端口。
      端口方向三种合法连接模式（严格遵守，违反将报错）：
      ① 同级组件连接 (Peer-to-Peer)：out -> in
         数据从源组件的输出端口流出，流入目标组件的输入端口。
         示例：`c1 : port Thread_A.data_out -> Thread_B.data_in;`
         严禁：同级组件之间绝对不能出现 in -> in 或 out -> out。
      ② 向下委派 (Delegation Down)：in -> in
         父容器的输入端口（外部数据的源头）指向子组件的输入端口（数据的终点）。左侧是父组件自身的端口（无前缀），右侧是子组件端口。
         示例：`c2 : port parent_in_port -> Thread_A.data_in;`
      ③ 向上委派 (Delegation Up)：out -> out
         子组件的输出端口（内部数据的源头）指向父容器的输出端口（向外发送的出口）。左侧是子组件端口，右侧是父组件自身的端口（无前缀）。
         示例：`c3 : port Thread_B.data_out -> parent_out_port;`
      特殊：in out 双向端口在同级连接中可作为源端或目标端；在委派中只能 in out <-> in out。
    R5【thread 纯净】thread implementation 中严禁出现 connections 和 subcomponents。组件间连接只能写在 system 或 process implementation 中。
    R6【数据端口语法】`in data port 类型名` 或 `out data port 类型名`，类型名必须是已声明的 data 组件。严禁 `requires data port`，严禁无类型声明。
    R7【软硬件关系两种模式】软件与硬件之间只有两种合法关系，严禁用 port 直接连接软件组件和纯硬件组件：
      模式1【部署关系】软件组件（thread/process）部署到硬件（processor/virtual processor）上运行，用 Properties 中的 `Actual_Processor_Binding` 属性表达，不是 connection。
      模式2【数据连线】软件组件与硬件之间有数据交互时，必须通过 device 作为桥梁：软件 port → device port（port 连接），device 通过 bus access 连到 bus，纯硬件（processor/memory）也通过 bus access 连到 bus。
      device 是唯一同时拥有 port 和 bus access 的软硬件桥梁组件。
    R7a【总线建模规范】正确的总线建模步骤：
      1. 纯硬件组件（processor/memory）通过 `requires bus access` 连接到 bus（bus access 连接，用 `<->`）。
      2. 建立一个 device 组件作为软硬件数据桥梁：它既有 data port（与软件的 port 相连），又有 `requires bus access`（连到 bus）。
      3. 软件组件与 device 之间的 port 连接（数据线），通过 `Allowed_Connection_Binding => reference (总线实例名) applies to 连接名;` 属性绑定到指定总线上，明确数据在哪条总线上传输。
      4. bus 组件自身通过 `provides bus access` 声明总线访问点。
    R7b【连接类型与实体匹配】软件实体（thread/process）connections 只能有 port 连接；纯硬件实体（processor/memory/bus）connections 只能有 bus access 连接；device 同时允许 port 和 bus access；system 均可。
    R8【三步顺序】implementation 内部必须按 subcomponents → connections → properties 顺序编写。
    R9【subcomponents 规范】格式：`实例名 : 组件关键字 组件类型名.impl;`，不得为空。父子类型必须合法（见下表），非法嵌套将被重构或删除。process 误放 processor 下时自动提取到 system 层并补 Actual_Processor_Binding；其他非法嵌套直接删除。

      【subcomponent 包含关系表】
      软件：process→thread/thread group/subprogram(group)/data；thread→subprogram(group)/data；subprogram→data；data→data/subprogram
      硬件：processor→processor/virtual processor/memory/virtual bus；virtual processor→virtual processor；memory→memory/virtual bus；bus→virtual bus；device→data
      系统：system→除 thread/thread group 外所有类型（thread 必须包装进 process）；abstract→所有类型
      禁忌：thread 不能直接放 system 或 virtual processor 下；process 不能放 processor 下；system 不能放 process/thread 下。

    R10【applies to 规范】properties 中 `applies to` 引用的实例名必须在当前 implementation 的 subcomponents 中已声明。
    R11【属性绑定完整性】process 和 thread 必须在包含它的 system 的 properties 块中通过 `Actual_Processor_Binding => reference (处理器实例名) applies to 实例名;` 声明部署绑定。缺失将导致代码生成无法确定软硬件映射。
    R12【数据类型深度一致】连接两端 data port 引用的 data 组件若有 `Data_Size` 属性，其值必须一致。不一致将导致 SCADE/Rust 代码生成时缓冲区溢出或数据截断。
    R13【命名空间唯一】subcomponents 实例名、connections 连接名、组件类型名三者不得重复。重名将导致编译器 AST 解析崩溃。实例名与类型名冲突时追加 `_inst` 后缀，连接名冲突时追加 `_conn` 后缀。

# 同义词映射表：key 为规范词，value 为该词的所有同义词/近义词列表
# 匹配时自动展开：若规则关键词命中某组任一成员（不区分大小写），该组全部成员参与匹配
# 新增同义词只需在此处维护，无需修改各规则的 anyKeywords
synonyms:
  # 处理器 / CPU 同义词组
  处理器: ["CPU", "MCU", "芯片", "processor", "处理单元", "处理器单元", "核心", "SoC", "DSP", "ARM", "单片机"]
  # 存储器 / 内存 同义词组
  存储器: ["内存", "RAM", "ROM", "Flash", "memory", "存储单元", "闪存", "EEPROM", "存储空间", "磁盘", "存储模块"]
  # 设备 / 外设 同义词组
  设备: ["外设", "外围设备", "device", "传感器", "执行器", "面板", "actuator", "sensor", "I/O设备", "输入设备", "输出设备", "单板", "定时器", "看门狗"]
  # 总线 同义词组（含具体总线协议名）
  总线: ["CAN", "I2C", "SPI", "Ethernet", "PCIE", "PCIe", "bus", "通信总线", "数据总线", "USB", "UART", "RS232", "RS485", "LIN", "FlexRay", "串行总线", "MIL-STD-1553", "现场总线", "背板总线"]
  # 分区 / 进程 同义词组
  分区: ["软件分区", "运行分区", "ARINC653", "ARINC 653", "进程", "process", "partition", "时空分区", "隔离分区", "时间分区", "空间分区"]
  # 任务 / 线程 同义词组
  任务: ["thread", "线程", "作业", "task", "调度任务", "周期任务", "工作线程", "后台任务", "中断任务"]
  # 网络接口 同义词组
  网络接口: ["网口", "网卡", "网络", "Network_interface", "Net_interface", "以太网", "TCP/IP", "网络控制器", "通信接口", "Ethernet", "网络适配器", "网络端口"]
  # 子系统 / 功能模块 同义词组
  子系统: ["功能子系统", "控制子系统", "通信子系统", "导航子系统", "检测子系统", "功能模块", "业务模块", "模块", "subsystem", "组件", "功能单元", "业务单元"]
  # 管理器（通用）同义词组
  管理器: ["manager", "管理模块", "管理单元", "控制单元"]
  # 系统管理器 同义词组
  系统管理器: ["system manager", "系统管理", "系统管理模块", "系统控制器"]
  # 模块管理器 同义词组
  模块管理器: ["module manager", "模块管理", "模块控制单元"]
  # 程序 / 函数 同义词组
  程序: ["初始化", "运行程序", "终止", "启动", "subprogram", "函数", "方法", "例程", "routine", "procedure", "回调", "入口函数"]
  # 数据 / 信号 同义词组
  数据: ["data", "信号", "帧", "字节", "结构体", "struct", "报文", "消息", "数据包", "数据帧", "payload", "报文格式", "数据结构", "消息格式"]
  # 错误行为 / 故障模型 同义词组
  错误行为: ["error behavior", "故障", "错误状态", "错误事件", "错误转移", "error model", "容错", "错误模型", "失效", "故障状态", "故障事件", "可靠性", "异常处理", "EMV2", "annex"]

rules:
  - id: package_structure
    title: 整体包结构
    always: true
    content: |
      package 项目名_Arch 或 领域名_Arch (如: EmbeddedRT_Arch, FlightCtrl_Arch, Vehicle_Arch)
      public
        -- 所有组件声明、组件实现、数据、程序均放在 public 中
      end 项目名_Arch;

      命名规则见 R1，推荐格式：{项目/领域名}_Arch。

  - id: top_system
    title: 顶层系统模板
    always: true
    content: |
      system Top_{项目名} 或 {项目名}_Top (如: Top_EmbeddedRT, EmbeddedRT_Top)
      end Top_{项目名};

      system implementation Top_{项目名}.impl
      subcomponents
        系统管理器名 : device 系统管理器名.impl;
        系统模块名 : system 系统模块名.impl;
        子系统名 : system 子系统名.impl;
        设备名 : device 设备名.impl;
        总线实例名 : bus 总线类型名.impl;
      end Top_{项目名}.impl;

      规则：
      1. 子系统作为 system 子组件放入 subcomponents，同时单独生成声明和实现（详见子系统模板）。
      2. 如果需求中给出 N 个总线，则生成 N 个 bus 子组件，命名为 总线类型名_1、...、总线类型名_N。总线为 0 时不生成 bus。

  - id: system_manager
    title: 系统管理器模板
    trigger:
      anyKeywords: ["系统管理器", "管理器", "system manager", "系统管理"]
    content: |
      device 系统管理器名
      end 系统管理器名;

      device implementation 系统管理器名.impl
      end 系统管理器名.impl;

      规则：如果需求中没有说明内部结构，则只生成空的 device implementation。

  - id: system_module
    title: 系统模块模板
    always: true
    content: |
      system 系统模块名
      end 系统模块名;

      system implementation 系统模块名.impl
      subcomponents
        系统模块管理器名 : device 系统模块管理器名.impl;
        子系统名 : system 子系统名.impl;
        软件分区名 : process 软件分区名.impl;
        网络接口名 : device 网络接口名.impl;
        处理器名 : processor 处理器名.impl;
        存储器名 : memory 存储器名.impl;
      end 系统模块名.impl;

      规则：
      1. 系统模块内部可包含模块管理器、子系统、软件分区、网络接口、处理器和存储器。
      2. 普通业务功能层级、功能模块、功能子系统建模为 system 子组件（子系统规则见子系统模板）。
      3. 只有需求明确出现"分区、进程、软件分区、运行分区、ARINC653 分区"时才建模为 process。
      4. 如果需求中没有某类组件，则不要生成该类组件。

  - id: subsystem
    title: 子系统模板
    trigger:
      anyKeywords: ["子系统", "功能子系统", "控制子系统", "通信子系统", "导航子系统", "检测子系统", "功能模块", "业务模块", "模块"]
    content: |
      system 子系统名
      end 子系统名;

      system implementation 子系统名.impl
      subcomponents
        子子系统名 : system 子子系统名.impl;
        设备名 : device 设备名.impl;
        软件分区名 : process 软件分区名.impl;
      end 子系统名.impl;

      规则：
      1. 子系统统一建模为 system，在父 system implementation 的 subcomponents 中实例化，同时单独生成声明和实现。
      2. 只有需求明确描述"分区、进程、软件分区"时才在子系统内使用 process，不要直接把业务子系统建模为 process。

  - id: module_manager
    title: 模块管理器模板
    trigger:
      anyKeywords: ["模块管理器"]
    content: |
      device 模块管理器名
      end 模块管理器名;

      device implementation 模块管理器名.impl
      end 模块管理器名.impl;

  - id: partition
    title: 分区模板
    trigger:
      anyKeywords: ["软件分区", "运行分区", "ARINC653", "ARINC 653", "进程", "process"]
    content: |
      process 分区名
      end 分区名;

      process implementation 分区名.impl
      subcomponents
        任务名 : thread 任务名.impl;
      end 分区名.impl;

      规则：process 只用于软件分区或进程，内部包含对应的 thread。

  - id: task
    title: 任务模板
    trigger:
      anyKeywords: ["任务", "thread"]
    content: |
      thread 任务名
      end 任务名;

      thread implementation 任务名.impl
      end 任务名.impl;

  - id: network_interface
    title: 网络接口模板
    trigger:
      anyKeywords: ["网络接口", "网口", "Network_interface", "Net_interface"]
    content: |
      device 网络接口名
      end 网络接口名;

      device implementation 网络接口名.impl
      end 网络接口名.impl;

  - id: processor
    title: 处理器模板
    trigger:
      anyKeywords: ["处理器", "分区运行", "网络接口运行", "运行于", "processor"]
    content: |
      processor 处理器名
      end 处理器名;

      processor implementation 处理器名.impl
      subcomponents
        分区名_runtime : virtual processor 分区名_runtime.impl;
        网络接口名_runtime : virtual processor 网络接口名_runtime.impl;
      end 处理器名.impl;

      virtual processor 分区名_runtime
      end 分区名_runtime;

      virtual processor implementation 分区名_runtime.impl
      end 分区名_runtime.impl;

      规则：
      1. 需求中"某分区运行"或"网络接口运行"均对应一个 virtual processor，命名为 对象名_runtime，需单独声明和实现。
      2. processor 的 subcomponents 中只能放 virtual processor（见 R9）。

  - id: memory
    title: 存储器模板
    trigger:
      anyKeywords: ["存储器", "内存", "memory"]
    content: |
      memory 存储器名
      end 存储器名;

      memory implementation 存储器名.impl
      subcomponents
        分区名_memory : memory 分区名_memory.impl;
        网络接口名_memory : memory 网络接口名_memory.impl;
      end 存储器名.impl;

      memory 分区名_memory
      end 分区名_memory;

      memory implementation 分区名_memory.impl
      end 分区名_memory.impl;

      规则：
      1. 需求中"某分区内存"或"网络接口内存"均对应一个 memory 子组件，命名为 对象名_memory，需单独声明和实现。

  - id: device
    title: 设备模板
    trigger:
      anyKeywords: ["设备", "传感器", "控制面板", "油门", "舵", "device"]
    content: |
      device 设备名
      features
        数据输入名 : in data port 数据类型名;
        数据输出名 : out data port 数据类型名;
        总线访问名 : requires bus access 总线类型名;
      end 设备名;

      device implementation 设备名.impl
      end 设备名.impl;

      规则：
      1. 设备同时拥有 data port（软件端口）和 requires bus access（硬件总线访问），是唯一软硬件桥梁（见 R3）。
      2. 如果需求中没有明确的数据端口或总线访问描述，则 device 类型声明中可省略 features 块。

  - id: bus
    title: 总线模板
    trigger:
      anyKeywords: ["总线", "PCIE", "PCIe", "bus"]
    skipIfKeywords: ["0个总线", "0 个总线", "总线为0", "总线为 0", "无总线", "没有总线"]
    content: |
      bus 总线类型名
      end 总线类型名;

      bus implementation 总线类型名.impl
      end 总线类型名.impl;

  - id: data
    title: 数据模板
    trigger:
      anyKeywords: ["数据", "当前", "目标", "状态", "指令", "data", "信号", "帧", "字节", "结构体", "struct", "BrakeSignal"]
    content: |
      data 数据名
      end 数据名;

      data implementation 数据名.impl
        properties
          -- 数据大小约束：当需求中声明"单帧数据固定占用N字节"或"数据结构大小为N字节"时，必须通过 Data_Size 属性声明
          Data_Size => N Bytes;
      end 数据名.impl;

      规则：
      1. 需求中出现"固定占用X字节"、"数据结构大小为X字节"、"固定帧长度"等描述时，必须在 data implementation 的 properties 中声明 Data_Size，禁止生成空 implementation。

  - id: subprogram
    title: 程序模板
    trigger:
      anyKeywords: ["程序", "初始化", "运行程序", "终止", "启动", "subprogram"]
    content: |
      subprogram 程序名
      end 程序名;

      subprogram implementation 程序名.impl
      end 程序名.impl;

      规则：
      1. 模块与设备程序包括：Initialization_program、Run_program 等。
      2. 程序名称必须与需求语义一致。

  - id: error_behavior
    title: 错误行为模型模板
    trigger:
      anyKeywords: ["错误行为", "error behavior", "故障", "错误状态", "错误事件", "错误转移", "error model", "容错", "错误模型", "失效", "EMV2"]
    content: |
      annex EMV2 {**
        error behavior 错误行为名
          events
            错误事件名 : error event;
          states
            状态名 : initial state;
            状态名 : state;
          transitions
            转移名 : 源状态 -[错误事件名]-> 目标状态;
        end behavior;
      **};

      规则：
      1. 只有需求中明确出现"错误行为、故障、容错、EMV2"等描述时才生成 annex EMV2 块，放在 package 的 public 段内。
      2. 整个块必须包裹在 "annex EMV2 {** ... **};" 中，严禁裸写 error behavior。
      3. events、states、transitions 三个段必须存在：events 声明 "事件名 : error event;"，states 必须有一个 "initial state" 其余为 "state"，transitions 格式为 "转移名 : 源状态 -[事件名]-> 目标状态;"。
      4. 每个 transition 引用的事件和状态必须在对应段中已声明。标识符用英文下划线连接。

  - id: subcomponents_syntax
    title: subcomponents 语法与完整性规则
    always: true
    content: |
      subcomponents 块的每一行必须严格遵循以下格式（不可省略任何部分）：

        实例名 : 组件关键字 组件类型名.impl;

      格式拆解：
        - 实例名：自由命名，首字母小写或大写均可，但不能与 AADL 保留字冲突。
        - 组件关键字：必须是 AADL 标准关键字之一（system / process / thread / processor /
          memory / device / bus / data / subprogram / virtual processor），严禁使用
          subsystem、module、component 等非标准关键字。
        - 组件类型名.impl：必须引用已在 package 中声明过类型和实现的组件，后缀 .impl 不可省略。

      正确示例：
        subcomponents
          BrakeCtrl : system BrakeCtrl.impl;
          TempSensor : device TempSensor.impl;
          CanBus_1  : bus CanBus.impl;
          MainTask   : thread MainTask.impl;

      错误示例（这些是常见的出错模式，严禁出现）：
        -- 错误1：缺少 .impl 后缀
        BrakeCtrl : system BrakeCtrl;
        -- 错误2：使用了非标准关键字 subsystem
        BrakeSubsystem : subsystem BrakeSubsystem.impl;
        -- 错误3：缺少分号
        BrakeCtrl : system BrakeCtrl.impl
        -- 错误4：实例名与类型名混淆，把实例名写成了 .impl
        BrakeCtrl.impl : system BrakeCtrl.impl;
        -- 错误5：引用了未声明的组件（BrakeCtrl 在 package 中没有对应的 system 声明和 implementation）
        BrakeCtrl : system BrakeCtrl.impl;  -- 但 package 中没有 system BrakeCtrl ... end BrakeCtrl;

      完整性规则：subcomponents 中引用的每一个组件，必须在同一个 package 中有完整的"类型声明 + 实现声明"对。实例名可与类型名相同或不同，但类型名必须与已声明的组件一致。父子类型合法性见核心规则 R9 包含关系表。

  - id: properties_explanation
    title: properties 关键字用法说明
    always: true
    content: |
      AADL 中的 properties 关键字用于声明组件的属性值，约束组件的物理特性、运行时行为、资源需求等。

      基本语法：
        properties
          属性名 => 属性值;
          属性名 => 属性值 applies to 目标组件;
        end;

      常用属性（来自 AADL 标准属性集）：
        - Data_Size => N Bytes;          -- 数据大小（data 组件用）
        - Period => N Ms;                -- 周期（thread 用）
        - Compute_Execution_Time => N Ms .. M Ms;  -- 计算执行时间范围（thread 用）
        - Deadline => N Ms;              -- 截止时间（thread 用）
        - Priority => N;                 -- 优先级（thread 用）
        - Stack_Size => N Bytes;         -- 栈大小（thread 用）
        - Max_Queue_Size => N;           -- 最大队列长度（port 用）
        - Actual_Processor_Binding => reference (处理器名) applies to 软件组件;  -- 处理器绑定
        - Memory_Properties::RAM_Size => N Bytes;  -- 内存大小（memory 组件用，必须带属性集前缀）

      属性适用性表（严格匹配，不可跨类型使用）：
        - Data_Size：仅适用于 data 组件
        - Period / Compute_Execution_Time / Deadline / Priority / Stack_Size：仅适用于 thread 组件
        - Max_Queue_Size：仅适用于 event data port
        - Actual_Processor_Binding：将 thread/process 绑定到 processor
        - RAM_Size / Access_Time / Transfer_Rate：仅适用于 memory 组件，且必须带 Memory_Properties:: 前缀
        - Allowed_Connection_Binding：仅适用于连接绑定

      AADL 标准单位（严禁使用英文全拼）：
        数据大小：Bytes, Kbyte, Mbyte, Gbyte（严禁 Kilobytes, Megabytes）
        时间：ps, ns, us, ms, sec, min, hr（严禁 Second, Seconds, Millisecond）
        频率：Hz, KHz, MHz, GHz（严禁 Hertz）
        速率：per Second（用 AADL 标准时间单位，如 100 per sec）

      规则：
      1. properties 块可出现在类型声明中（features 之后，固有属性）或实现声明中（subcomponents 之后，实现专属属性）。
      2. 需求中明确声明的数值约束必须通过 properties 映射，未给出数值时不生成 properties 块。
      3. 属性值适用于所有实现时放类型声明，因实现不同而变化时放实现声明。
      4. 属性必须严格匹配适用类型（见上表），严禁跨类型使用。
      5. 废弃属性、前缀、格式等细节见【补充禁止项】。

  - id: connections
    title: 连接声明模板
    always: true
    content: |
      connections 块放在 system/process implementation 内部（subcomponents 之后、properties 之前）。连接语法见 R4，此处仅补充内联属性用法。

      端口连接：`conn_name : port source_feature -> destination_feature;`
      访问连接：`conn_name : bus access source_feature <-> destination_feature;`

      连接内联属性（花括号包裹，分号结尾，紧跟连接末尾）：
        conn_name : port Sensor.out_data -> Processor.in_data {latency => 2ms..4ms;};

      规则：
      1. 当需求中明确给出连接的延迟、带宽等约束时，使用连接内联属性附加在连接声明末尾。
      2. 常用内联属性：latency（延迟范围，如 latency => 2ms..4ms;）、Timing（时序）。

  - id: flows
    title: 流声明模板
    trigger:
      anyKeywords: ["流", "flow", "端到端", "数据流路径", "flow path", "flow source", "flow sink", "end to end flow"]
    content: |
      flows 块用于声明组件的端到端数据流路径，放在组件类型声明的 features 之后。

      三种流声明类型：
        1. flow source（流源）：数据从该组件产生向外输出
           流名 : flow source out_port_name;
           例：current_temperature_flow : flow source current_temperature;

        2. flow sink（流汇）：数据从外部流入该组件终止
           流名 : flow sink in_port_name;
           例：heat_control_flow : flow sink heat_control;

        3. flow path（流路径）：数据穿过该组件，从输入端口到输出端口
           流名 : flow path in_port_name -> out_port_name;
           例：current_temperature_flow : flow path current_temperature -> heat_control;

      end to end flow（端到端流，在 implementation 的 flows 块中声明）：
        流名 : end to end flow 组件A.流A -> 连接名 -> 组件B.流B -> 连接名 -> 组件C.流C {属性};
        例：path1 : end to end flow temperature_sensor.current_temperature_flow -> current_temperature -> thermostat.current_temperature_flow -> heat_control -> heat_source.heat_control_flow {latency => 5ms..9ms;};

      语法说明：
      1. flow source/sink/path 声明在组件类型声明（system/device 等）的 features 之后，与 features 平级。
      2. end to end flow 声明在 implementation 的 flows 块中，引用子组件的流和 connections 中的连接名。
      3. end to end flow 通过 "-> 连接名 ->" 将各子组件的流串联起来。

      规则：
      1. 只有需求中明确描述"数据流路径、端到端流、数据流向"等内容时，才生成 flows 块。
      2. flow source 用于数据产生者（如传感器），flow sink 用于数据消费者（如执行器），flow path 用于数据中转者（如控制器）。
      3. end to end flow 中引用的流名必须在对应子组件的类型声明中已定义，引用的连接名必须在 connections 块中已声明。
      4. end to end flow 可以携带内联属性（如 latency），格式与连接内联属性一致。
      5. flows 块在 implementation 中放在 connections 之后、properties 之前。

order:
  content: |
    生成顺序：
    1. package
    2. 顶层 system 及 implementation
    3. 系统管理器 device 及 implementation
    4. 系统模块 system 及 implementation
    5. 模块管理器 device 及 implementation
    6. 各 system 子系统及 implementation
    7. 各 process 软件分区及 implementation
    8. 各 thread 任务及 implementation
    9. 网络接口 device 及 implementation
    10. processor 及 processor implementation
    11. virtual processor 声明及 implementation
    12. memory 及 implementation
    13. 子 memory 声明及 implementation
    14. 外部 device 声明及 implementation
    15. bus 声明及 implementation
    16. data 声明及 implementation
    17. subprogram 声明及 implementation
    18. annex EMV2 错误行为模型（如有）
    19. end package

forbidden:
  content: |
    补充禁止项（核心红线规则未覆盖的细节）：
    1. 属性值格式：数值与单位间有空格（10 Kbyte），范围用 .. 连接（5 ms .. 10 ms），列表用括号包裹（("Ok", "Error")）。
    2. 严禁使用已废弃属性 Source_Data_Size 和 Destination_Data_Size，必须使用 Data_Size。
    3. 非标准属性集的属性必须带前缀（如 Memory_Properties::RAM_Size），严禁直接写属性名。

checklist:
  content: |
    【输出前自检清单】生成代码前逐条确认，任一项为否则修正后再输出：
    [1] R2: 每个组件是否都有类型声明 + implementation，且各自有 end 闭合？
    [2] R3: features 只在类型声明中？data 无 features？port/bus access 归属的构件类型正确？
    [3] R4: 连接端点在 features 中已声明？子组件端点用「实例名.端口名」、父组件端口委派直接写端口名？port 连 port、access 连 access 无混连？port 用 ->（双向端口可用 <->）、access 用 <->？端口方向是否正确：同级连接 out->in（严禁 in->in、out->out）、向下委派 in->in（父端口在左、子端口在右）、向上委派 out->out（子端口在左、父端口在右）？类型一致？无 data 组件端口引用？
    [4] R5: thread implementation 中无 connections 和 subcomponents？
    [5] R7: 软件与硬件关系是否正确？部署用 Actual_Processor_Binding（非连接）？数据交互通过 device 桥接，不直接用 port 连软件和纯硬件？
    [6] R7a: 总线建模是否规范？processor/memory 通过 bus access 连 bus？device 同时有 port（连软件）和 bus access（连 bus）？数据线通过 Allowed_Connection_Binding 绑定到 bus？
    [7] R7b: 软件实体 connections 只有 port？纯硬件实体只有 bus access？device 允许两者？
    [8] R8: implementation 内部顺序 subcomponents → connections → properties？
    [9] R9: subcomponent 父子类型合法？thread 不在 system 下？process 不在 processor 下？
    [10] R10: applies to 引用的实例名在 subcomponents 中已声明？
    [11] R11: 每个 process 和 thread 都有 Actual_Processor_Binding 属性绑定？
    [12] R12: 连接两端 data port 的 Data_Size 一致？
    [13] R13: 实例名、连接名、类型名无重名？

example:
  title: AADL生成示例
  description: 以下是一个完整的AADL模型示例，请参考其格式生成代码
  content: |
    package OS_Arch 
    public 

    -- ======================================= 
    -- 1. EMV2 错误模型库声明（修正：直接定义在 annex 块内）
    -- ======================================= 
    annex EMV2 {**
      error behavior ThreeErrorStates
        events
          BadValueEvent  : error event;
          NoValueEvent   : error event;
          LateValueEvent : error event;
        states
          Operational    : initial state;
          BadValueState  : state;
          NoValueState   : state;
          LateValueState : state;
        transitions
          BadValueTransition : Operational -[BadValueEvent]-> BadValueState;
          NoValueTransition  : Operational -[NoValueEvent]-> NoValueState;
          LateTransition     : Operational -[LateValueEvent]-> LateValueState;
      end behavior;
    **};

    -- ======================================= 
    -- 2. 顶层系统容器 
    -- ======================================= 
    system Top_System 
    end Top_System; 

    system implementation Top_System.impl 
      subcomponents 
        MainProcessor      : processor MainProcessor.impl; 
        RAM                : memory RAM.impl; 
        Flash              : memory Flash.impl; 
        SerialPort         : device SerialPort.impl; 
        CANController      : device CANController.impl; 
        EthernetController : device EthernetController.impl; 
        HardwareTimer      : device HardwareTimer.impl; 
        WatchdogTimer      : device WatchdogTimer.impl; 
        CanBus_1           : bus CanBus.impl;
        KernelProcess      : process KernelProcess.impl; 
      connections 
        -- 软件与 device 桥接：port 连接（数据线）
        data_flow : port SerialPort.out_data -> KernelProcess.in_data;
        -- 硬件总线连接：processor/memory 通过 bus access 连到 bus
        proc_bus : bus access MainProcessor.bus_if <-> CanBus_1.busOut;
        ram_bus  : bus access RAM.bus_if <-> CanBus_1.busOut;
        -- device 桥接：同时连 port（软件侧）和 bus access（硬件侧）
        can_bus_conn : bus access CANController.canIn <-> CanBus_1.busOut;
      properties 
        -- 软件部署绑定：process → processor
        Actual_Processor_Binding => (reference (MainProcessor)) applies to KernelProcess; 
        -- 数据线绑定到总线：明确数据在哪条总线上传输
        Allowed_Connection_Binding => (reference (CanBus_1)) applies to data_flow;
    end Top_System.impl; 

    -- ======================================= 
    -- 3. 软件组件定义 
    -- ======================================= 
    process KernelProcess 
      features
        in_data : in data port SerialData;
        out_data : out data port SerialData;
    end KernelProcess; 

    process implementation KernelProcess.impl 
      subcomponents 
        TaskScheduler        : thread TaskScheduler.impl; 
        TimerManager         : thread TimerManager.impl; 
        InterruptHandler     : thread InterruptHandler.impl; 
        MemoryManager        : thread MemoryManager.impl; 
        CommunicationManager : thread CommunicationManager.impl; 
        FileSystem           : thread FileSystem.impl; 
        WatchdogManager      : thread WatchdogManager.impl; 
        FaultDetector        : thread FaultDetector.impl; 
        PerformanceMonitor   : thread PerformanceMonitor.impl; 
      connections
        -- 向下委派(Delegation Down)：父 in -> 子 in（父端口在左侧，无前缀）
        c_down : port in_data -> CommunicationManager.in_data;
        -- 向上委派(Delegation Up)：子 out -> 父 out（父端口在右侧，无前缀）
        c_up : port CommunicationManager.out_data -> out_data;
        -- 同级连接(Peer-to-Peer)：out -> in（子组件之间）
        c_peer : port CommunicationManager.out_data -> TaskScheduler.in_data;
    end KernelProcess.impl; 

    thread TaskScheduler
      features
        in_data : in data port SerialData;
    end TaskScheduler;
    thread implementation TaskScheduler.impl
    end TaskScheduler.impl;

    thread TimerManager
    end TimerManager;
    thread implementation TimerManager.impl
    end TimerManager.impl;

    thread InterruptHandler
    end InterruptHandler;
    thread implementation InterruptHandler.impl
    end InterruptHandler.impl;

    thread MemoryManager
    end MemoryManager;
    thread implementation MemoryManager.impl
    end MemoryManager.impl;

    thread CommunicationManager
      features
        in_data : in data port SerialData;
        out_data : out data port SerialData;
    end CommunicationManager;
    thread implementation CommunicationManager.impl
    end CommunicationManager.impl;

    thread FileSystem
    end FileSystem;
    thread implementation FileSystem.impl
    end FileSystem.impl;

    thread WatchdogManager
    end WatchdogManager;
    thread implementation WatchdogManager.impl
    end WatchdogManager.impl;

    thread FaultDetector
    end FaultDetector;
    thread implementation FaultDetector.impl
    end FaultDetector.impl;

    thread PerformanceMonitor
    end PerformanceMonitor;
    thread implementation PerformanceMonitor.impl
    end PerformanceMonitor.impl;

    -- =======================================
    -- 4. 数据组件及信号定义
    -- =======================================
    data SerialData
    end SerialData;

    data BrakeSignal
    end BrakeSignal;

    data implementation BrakeSignal.impl
      properties
        Data_Size => 8 Bytes;
    end BrakeSignal.impl;

    data ControlFrame
    end ControlFrame;

    data implementation ControlFrame.impl
      properties
        Data_Size => 16 Bytes;
    end ControlFrame.impl;

    -- ======================================= 
    -- 5. 硬件组件定义 
    -- ======================================= 
    processor MainProcessor 
      features
        bus_if : requires bus access CanBus;
    end MainProcessor; 
    processor implementation MainProcessor.impl 
    end MainProcessor.impl; 

    memory RAM 
      features
        bus_if : requires bus access CanBus;
    end RAM; 
    memory implementation RAM.impl 
    end RAM.impl; 

    memory Flash 
    end Flash; 
    memory implementation Flash.impl 
    end Flash.impl; 

    device SerialPort 
      features
        out_data : out data port SerialData;
    end SerialPort; 
    device implementation SerialPort.impl 
    end SerialPort.impl; 

    device CANController 
      features
        canIn : requires bus access CanBus;
    end CANController; 
    device implementation CANController.impl 
    end CANController.impl; 

    device EthernetController 
    end EthernetController; 
    device implementation EthernetController.impl 
    end EthernetController.impl; 

    device HardwareTimer 
    end HardwareTimer; 
    device implementation HardwareTimer.impl 
    end HardwareTimer.impl; 

    device WatchdogTimer 
    end WatchdogTimer; 
    device implementation WatchdogTimer.impl 
    end WatchdogTimer.impl; 

    bus CanBus
      features
        busOut : provides bus access CanBus;
    end CanBus;
    bus implementation CanBus.impl
    end CanBus.impl;

    end OS_Arch;