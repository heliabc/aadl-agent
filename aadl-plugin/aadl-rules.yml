version: 1

system_prompt: |
  你是一名专业的嵌入式系统架构工程师，擅长使用AADL描述实时系统架构。

task_description: |
  任务目标：根据架构树和模块分析结果，按照给定的规则生成完整的AADL模型文件。

input_section: |
  以下是根据架构树和模块分析解析出的结构化组件清单和约束。请严格按照此清单生成 AADL 代码：
  - 清单中列出的组件必须全部出现在 AADL 代码中，不得遗漏。
  - 不得生成清单之外的组件。
  - 每个组件的 AADL 类型必须与清单中指定的类型完全一致。
  - 模块约束中的功能描述和关联组件信息必须映射到 AADL 的 properties 和 connections 中。

architecture_label: 架构树：

modules_label: 模块分析：

output_instruction: 请输出完整的AADL代码：

global:
  alwaysRules: |
    1. 只输出完整 AADL 代码，不要输出 Markdown 代码块、解释或自然语言说明。
    2. 不要生成需求模板中未定义的连接、端口、属性、线程、进程、设备、总线或数据。
    3. 所有 AADL 标识符必须使用英文和下划线，不要输出中文标识符。
    4. 绝对禁止使用 AADL 强保留关键字（如 system, process, thread, processor, memory, device, bus, data，不区分大小写）作为包名或组件名。必须加前缀或后缀（如 Top_System, Main_Process）。
    5. package 名称必须使用 {项目名}_Arch 格式（如：EmbeddedRT_Arch），严禁使用 System、App、Main 等单个单词。
    6. 顶层系统名称必须使用 Top_{项目名} 或 {项目名}_Top 格式（如：Top_EmbeddedRT），严禁使用 System、App、Main 等单个单词。
    7. 【最高优先级规则】所有组件（system/process/thread/processor/memory/device/bus/data/subprogram等）必须严格按照以下格式定义，缺一不可：
       第一步：类型声明（必须有 end 闭合！）
         组件类型 组件名
         end 组件名;
       第二步：实现声明（必须有 end 闭合！）
         组件类型 implementation 组件名.impl
           subcomponents（如有）
         end 组件名.impl;
       错误示例：缺少类型声明的 end：
         thread TaskScheduler                    ← 错误！缺少 end TaskScheduler;
         thread implementation TaskScheduler.impl
         end TaskScheduler.impl;
       正确示例：完整格式：
         thread TaskScheduler
         end TaskScheduler;                      ← 必须有！
         thread implementation TaskScheduler.impl
         end TaskScheduler.impl;
    8. subcomponents 不能为空：任何 implementation（.impl）的 subcomponents 块中必须至少包含一个子组件声明。如果当前层级确实没有子组件，则必须向上合并到父组件中，或在 subcomponents 中声明至少一个占位子组件。严禁生成空的 subcomponents 块后直接 end。
    9. 所有 implementation 后缀统一使用 .impl。
    10. package 名与顶层 system 名保持一致。
    11. 如果某类结构没有在需求模板中出现，不要因为示例或规则文本主动补充该结构。
    12. 【features 放置规则】features 块只能出现在组件类型声明中（如 `processor MainProcessor ... features ... end MainProcessor;`），严禁出现在 implementation 声明中。implementation 中只能包含 subcomponents、connections、properties、flows 等块，不能包含 features。
    13. 【connections 引用规则】connections 中引用的每一个端口/访问点（格式：`实例名.端口名`）必须在该实例对应组件类型的 features 块中已声明。如果某组件类型没有声明某个 feature，则 connections 中严禁引用该 feature。生成 connections 前必须先确认两端组件的 features 块中确实存在被引用的端口名。
    14. 严禁在 thread implementation 中编写 connections 块！线程内部只能包含 properties，不能包含 connections、subcomponents。组件之间的连接只能写在 system 或 process 的 implementation 中。
    15. 严禁使用 requires data port 语法！requires 关键字只能用于 bus access / subprogram access。数据端口必须明确方向：in data port（输入）或 out data port（输出）。
    16. 严禁在 properties 中使用 applies to 引用未在当前 implementation 的 subcomponents 中声明的实例。applies to 的目标必须是当前 implementation 中已实例化的子组件名。
    17. 严禁在 virtual processor 的 subcomponents 中直接包含 thread！虚拟处理器只能包含其他虚拟处理器或进程。线程只能作为 process 的子组件。
    18. 严禁截断连接行：每条连接声明必须完整写出两端端口引用（格式：`实例名.端口名`）并以分号结尾。严禁出现 `Instance.` 后面缺少端口名、或只有 `Instance` 而没有 `.端口名` 的情况。
    19. 【数据端口类型规则】in data port / out data port 引用的类型必须是已声明的 data 组件类型（如 `in data port BrakeSignal;`，其中 BrakeSignal 必须是 `data BrakeSignal ... end BrakeSignal;` 声明的数据组件）。严禁将 device、process、system 等非 data 组件类型用作数据端口的类型。
    20. 【分层架构规范 - 各司其职】软件层（thread / process）专注功能逻辑与数据流转，组件间通信必须使用 port（数据端口连接，单向 ->）。硬件层（bus / device / processor / memory）专注物理拓扑，总线访问（bus access）和物理绑定（Actual_Processor_Binding）只能在顶层 system implementation 中处理。严禁让底层软件线程直接与物理总线发生跨层双向连线。
    21. 【分层架构规范 - port vs access 区分】port（端口连接）用于软件组件之间（Device -> Process -> Thread）的数据传输，方向清晰（单向 ->），是最稳定的连线方式。access（总线/数据访问连接）仅用于处理器、内存、设备与总线之间的物理连接。功能架构建模中能用 port 表达的数据交互严禁滥用 bus access，以降低语法出错率。
    22. 【分层架构规范 - bus access 层级限制】bus access 连接只能出现在 system implementation 中，严禁出现在 process implementation 或 thread implementation 中。进程内部只做纯粹的 port 数据流连接。
    23. 【三步规范】编写 implementation 时必须严格遵守顺序：第一步 subcomponents（声明所有组件实例）→ 第二步 connections（所有源端和目标端必须来源于对应组件的 features 定义且实例名在 subcomponents 中存在）→ 第三步 properties（属性绑定）。严禁打乱此顺序。

# 同义词映射表：key 为规范词，value 为该词的所有同义词/近义词列表
# 匹配时自动展开：若规则关键词命中某组任一成员（不区分大小写），该组全部成员参与匹配
# 新增同义词只需在此处维护，无需修改各规则的 anyKeywords
synonyms:
  # 处理器 / CPU 同义词组
  处理器: ["CPU", "MCU", "芯片", "processor", "处理单元", "处理器单元", "核心", "SoC", "DSP", "ARM", "单片机"]
  # 存储器 / 内存 同义词组
  存储器: ["内存", "RAM", "ROM", "Flash", "memory", "存储单元", "闪存", "EEPROM", "存储空间", "磁盘", "存储模块"]
  # 设备 / 外设 同义词组
  设备: ["外设", "外围设备", "device", "传感器", "执行器", "面板", "actuator", "sensor", "I/O设备", "输入设备", "输出设备", "单板", "定时器", "看门狗"]
  # 总线 同义词组（含具体总线协议名）
  总线: ["CAN", "I2C", "SPI", "Ethernet", "PCIE", "PCIe", "bus", "通信总线", "数据总线", "USB", "UART", "RS232", "RS485", "LIN", "FlexRay", "串行总线", "MIL-STD-1553", "现场总线", "背板总线"]
  # 分区 / 进程 同义词组
  分区: ["软件分区", "运行分区", "ARINC653", "ARINC 653", "进程", "process", "partition", "时空分区", "隔离分区", "时间分区", "空间分区"]
  # 任务 / 线程 同义词组
  任务: ["thread", "线程", "作业", "task", "调度任务", "周期任务", "工作线程", "后台任务", "中断任务"]
  # 网络接口 同义词组
  网络接口: ["网口", "网卡", "网络", "Network_interface", "Net_interface", "以太网", "TCP/IP", "网络控制器", "通信接口", "Ethernet", "网络适配器", "网络端口"]
  # 子系统 / 功能模块 同义词组
  子系统: ["功能子系统", "控制子系统", "通信子系统", "导航子系统", "检测子系统", "功能模块", "业务模块", "模块", "subsystem", "组件", "功能单元", "业务单元"]
  # 管理器（通用）同义词组
  管理器: ["manager", "管理模块", "管理单元", "控制单元"]
  # 系统管理器 同义词组
  系统管理器: ["system manager", "系统管理", "系统管理模块", "系统控制器"]
  # 模块管理器 同义词组
  模块管理器: ["module manager", "模块管理", "模块控制单元"]
  # 程序 / 函数 同义词组
  程序: ["初始化", "运行程序", "终止", "启动", "subprogram", "函数", "方法", "例程", "routine", "procedure", "回调", "入口函数"]
  # 数据 / 信号 同义词组
  数据: ["data", "信号", "帧", "字节", "结构体", "struct", "报文", "消息", "数据包", "数据帧", "payload", "报文格式", "数据结构", "消息格式"]
  # 错误行为 / 故障模型 同义词组
  错误行为: ["error behavior", "故障", "错误状态", "错误事件", "错误转移", "error model", "容错", "错误模型", "失效", "故障状态", "故障事件", "可靠性", "异常处理", "EMV2", "annex"]

rules:
  - id: package_structure
    title: 整体包结构
    always: true
    content: |
      package 项目名_Arch 或 领域名_Arch (如: EmbeddedRT_Arch, FlightCtrl_Arch, Vehicle_Arch)
      public
        -- 所有组件声明、组件实现、数据、程序均放在 public 中
      end 项目名_Arch;
      
      命名规则：
      1. package 名称必须以项目或领域名称开头，使用下划线连接。
      2. 严禁使用单个单词如 System、App、Main 作为 package 名称。
      3. 推荐格式：{项目/领域名}_Arch（如：EmbeddedRT_Arch）。

  - id: top_system
    title: 顶层系统模板
    always: true
    content: |
      system Top_{项目名} 或 {项目名}_Top (如: Top_EmbeddedRT, EmbeddedRT_Top)
      end Top_{项目名};

      system implementation Top_{项目名}.impl
      subcomponents
        系统管理器名 : device 系统管理器名.impl;
        系统模块名 : system 系统模块名.impl;
        子系统名 : system 子系统名.impl;
        设备名 : device 设备名.impl;
        总线实例名 : bus 总线类型名.impl;
      end Top_{项目名}.impl;

      规则：
      1. 顶层系统表示整个系统。
      2. 系统管理器建模为 device。
      3. 系统模块建模为 system。
      4. AADL 中表达"子系统"的方式是：在某个 system implementation 的 subcomponents 中声明另一个 system 子组件。
      5. 如果需求中有多个子系统，必须把这些子系统作为父 system implementation 的 system 子组件放入 subcomponents 中。
      6. 子系统自身还必须单独生成 system 声明和 system implementation。
      7. 外部设备全部建模为 device。
      8. 如果需求中给出 N 个总线，则在顶层系统实现中生成 N 个 bus 子组件。
      9. 总线实例命名为 总线类型名_1、总线类型名_2、...、总线类型名_N。
      10. 如果需求中总线为 0 个，则不要生成 bus。
      11. 顶层系统名称必须使用前缀 Top_ 或后缀 _Top，严禁使用 System、App、Main 等单独单词。

  - id: system_manager
    title: 系统管理器模板
    trigger:
      anyKeywords: ["系统管理器", "管理器", "system manager", "系统管理"]
    content: |
      device 系统管理器名
      end 系统管理器名;

      device implementation 系统管理器名.impl
      end 系统管理器名.impl;

      规则：如果需求中没有说明内部结构，则只生成空的 device implementation。

  - id: system_module
    title: 系统模块模板
    always: true
    content: |
      system 系统模块名
      end 系统模块名;

      system implementation 系统模块名.impl
      subcomponents
        系统模块管理器名 : device 系统模块管理器名.impl;
        子系统名 : system 子系统名.impl;
        软件分区名 : process 软件分区名.impl;
        网络接口名 : device 网络接口名.impl;
        处理器名 : processor 处理器名.impl;
        存储器名 : memory 存储器名.impl;
      end 系统模块名.impl;

      规则：
      1. 系统模块内部可以包含模块管理器、子系统、软件分区、网络接口、处理器和存储器。
      2. 模块管理器建模为 device。
      3. 普通业务功能层级、功能模块、功能子系统建模为 system 子组件。
      4. 子系统不能只声明 system 类型，必须同时在父 system implementation 的 subcomponents 中实例化。
      5. 子系统自身还必须单独生成 system 声明和 system implementation。
      6. 只有需求明确出现"分区、进程、软件分区、运行分区、ARINC653 分区"时，才建模为 process。
      7. 网络接口建模为 device。
      8. 处理器建模为 processor。
      9. 存储器建模为 memory。
      10. 如果需求中没有某类组件，则不要生成该类组件。

  - id: subsystem
    title: 子系统模板
    trigger:
      anyKeywords: ["子系统", "功能子系统", "控制子系统", "通信子系统", "导航子系统", "检测子系统", "功能模块", "业务模块", "模块"]
    content: |
      system 子系统名
      end 子系统名;

      system implementation 子系统名.impl
      subcomponents
        子子系统名 : system 子子系统名.impl;
        设备名 : device 设备名.impl;
        软件分区名 : process 软件分区名.impl;
      end 子系统名.impl;

      规则：
      1. AADL 没有单独的 subsystem 组件类别，子系统统一建模为 system。
      2. AADL 里表达"子系统"的方式是：在 subcomponents 中声明另一个 system 子组件。
      3. 每个子系统既要有自己的 system 声明和 implementation，也必须放入父 system implementation 的 subcomponents 中。
      4. 只有当需求明确描述"分区、进程、软件分区"时，才在子系统内使用 process。
      5. 不要把普通业务功能子系统直接建模为 process。

  - id: module_manager
    title: 模块管理器模板
    trigger:
      anyKeywords: ["模块管理器"]
    content: |
      device 模块管理器名
      end 模块管理器名;

      device implementation 模块管理器名.impl
      end 模块管理器名.impl;

  - id: partition
    title: 分区模板
    trigger:
      anyKeywords: ["软件分区", "运行分区", "ARINC653", "ARINC 653", "进程", "process"]
    content: |
      process 分区名
      end 分区名;

      process implementation 分区名.impl
      subcomponents
        任务名 : thread 任务名.impl;
      end 分区名.impl;

      规则：
      1. process 只用于软件分区或进程。
      2. 每个分区内部包含其对应任务(thread)。

  - id: task
    title: 任务模板
    trigger:
      anyKeywords: ["任务", "thread"]
    content: |
      thread 任务名
      end 任务名;

      thread implementation 任务名.impl
      end 任务名.impl;

  - id: network_interface
    title: 网络接口模板
    trigger:
      anyKeywords: ["网络接口", "网口", "Network_interface", "Net_interface"]
    content: |
      device 网络接口名
      end 网络接口名;

      device implementation 网络接口名.impl
      end 网络接口名.impl;

  - id: processor
    title: 处理器模板
    trigger:
      anyKeywords: ["处理器", "分区运行", "网络接口运行", "运行于", "processor"]
    content: |
      processor 处理器名
      end 处理器名;

      processor implementation 处理器名.impl
      subcomponents
        分区名_runtime : virtual processor 分区名_runtime.impl;
        网络接口名_runtime : virtual processor 网络接口名_runtime.impl;
      end 处理器名.impl;

      virtual processor 分区名_runtime
      end 分区名_runtime;

      virtual processor implementation 分区名_runtime.impl
      end 分区名_runtime.impl;

      规则：
      1. 需求中"某分区运行"对应一个 virtual processor。
      2. 需求中"网络接口运行"也对应一个 virtual processor。
      3. virtual processor 命名为 对象名_runtime。
      4. 所有 virtual processor 都需要单独声明和实现。
      5. 严禁在 processor 的 subcomponents 中直接声明 process！

  - id: memory
    title: 存储器模板
    trigger:
      anyKeywords: ["存储器", "内存", "memory"]
    content: |
      memory 存储器名
      end 存储器名;

      memory implementation 存储器名.impl
      subcomponents
        分区名_memory : memory 分区名_memory.impl;
        网络接口名_memory : memory 网络接口名_memory.impl;
      end 存储器名.impl;

      memory 分区名_memory
      end 分区名_memory;

      memory implementation 分区名_memory.impl
      end 分区名_memory.impl;

      规则：
      1. 需求中"某分区内存"对应一个 memory 子组件。
      2. 需求中"网络接口内存"也对应一个 memory 子组件。
      3. 所有 memory 都需要单独声明和实现。

  - id: device
    title: 设备模板
    trigger:
      anyKeywords: ["设备", "传感器", "控制面板", "油门", "舵", "device"]
    content: |
      device 设备名
      features
        数据输入名 : in data port 数据类型名;
        数据输出名 : out data port 数据类型名;
        总线访问名 : requires bus access 总线类型名;
      end 设备名;

      device implementation 设备名.impl
      end 设备名.impl;

      规则：
      1. 设备的数据收发通过 features 块中的 in data port / out data port 声明。
      2. 设备访问总线必须通过 features 块中的 requires bus access 声明，严禁用 in/out 端口代替总线访问。
      3. requires bus access 指明设备所依赖的总线类型（如 requires bus access CanBus;）。
      4. 如果需求中没有明确的数据端口或总线访问描述，则 device 类型声明中可以省略 features 块。

  - id: bus
    title: 总线模板
    trigger:
      anyKeywords: ["总线", "PCIE", "PCIe", "bus"]
    skipIfKeywords: ["0个总线", "0 个总线", "总线为0", "总线为 0", "无总线", "没有总线"]
    content: |
      bus 总线类型名
      end 总线类型名;

      bus implementation 总线类型名.impl
      end 总线类型名.impl;

  - id: data
    title: 数据模板
    trigger:
      anyKeywords: ["数据", "当前", "目标", "状态", "指令", "data", "信号", "帧", "字节", "结构体", "struct", "BrakeSignal"]
    content: |
      data 数据名
      end 数据名;

      data implementation 数据名.impl
        properties
          -- 数据大小约束：当需求中声明"单帧数据固定占用N字节"或"数据结构大小为N字节"时，必须通过 Data_Size 属性声明
          Data_Size => N Bytes;
      end 数据名.impl;

      规则：
      1. 当需求中出现"单帧数据固定占用X字节存储空间与传输带宽"、"数据结构大小为X字节"、"固定帧长度"等描述时，必须在 data implementation 的 properties 中声明 Data_Size 属性。
      2. 数据组件（如 BrakeSignal、ControlFrame 等）若有明确的字节大小约束，禁止生成空的 data implementation，必须携带对应的 properties 属性。
      3. 对于结构体/记录类型的数据，若各字段有固定大小，应在 properties 中声明总 Data_Size，确保传输带宽与存储空间约束被完整映射到 AADL 模型中。

  - id: subprogram
    title: 程序模板
    trigger:
      anyKeywords: ["程序", "初始化", "运行程序", "终止", "启动", "subprogram"]
    content: |
      subprogram 程序名
      end 程序名;

      subprogram implementation 程序名.impl
      end 程序名.impl;

      规则：
      1. 模块与设备程序包括：Initialization_program、Run_program 等。
      2. 程序名称必须与需求语义一致。

  - id: error_behavior
    title: 错误行为模型模板
    trigger:
      anyKeywords: ["错误行为", "error behavior", "故障", "错误状态", "错误事件", "错误转移", "error model", "容错", "错误模型", "失效", "EMV2"]
    content: |
      annex EMV2 {**
        error behavior 错误行为名
          events
            错误事件名 : error event;
          states
            状态名 : initial state;
            状态名 : state;
          transitions
            转移名 : 源状态 -[错误事件名]-> 目标状态;
        end behavior;
      **};

      语法说明：
      1. error behavior 是 AADL 错误模型附件（Error Model Annex, EMV2）的声明块，用于描述组件的故障行为。
      2. 整个 error behavior 块必须包裹在 "annex EMV2 {** ... **};" 中，严禁裸写 error behavior。
      3. "annex EMV2 {**" 开启附件块，"**};" 闭合附件块，两者缺一不可。
      4. events 段：声明错误事件，格式为 "事件名 : error event;"。
      5. states 段：声明错误状态，必须有一个 "initial state"，其余为 "state"。
      6. transitions 段：声明状态转移，格式为 "转移名 : 源状态 -[事件名]-> 目标状态;"。
      7. error behavior 块内部以 "end behavior;" 闭合，整个附件块以 "**};" 闭合。

      规则：
      1. 只有需求中明确出现"错误行为、故障状态、错误事件、容错、错误模型、EMV2"等描述时，才生成 annex EMV2 块。
      2. 严禁省略 annex EMV2 包裹，裸写 error behavior 会导致语法错误。
      3. events、states、transitions 三个段都必须存在，不可省略。
      4. states 段中必须且只能有一个 initial state。
      5. 每个 transition 引用的事件必须在 events 段中声明，引用的状态必须在 states 段中声明。
      6. annex EMV2 块通常放在 package 的 public 段内，与其他组件声明平级。
      7. 错误事件名、状态名、转移名使用英文标识符，下划线连接。
      8. 转移箭头格式固定为 "源状态 -[事件名]-> 目标状态"，方括号不可省略。

  - id: naming
    title: 命名规则
    always: true
    content: |
      1. 中文名称转换为英文直译，英文名称使用下划线连接。
      2. 严禁使用 System, Process 等 AADL 保留关键字作为名称。

  - id: subcomponents_syntax
    title: subcomponents 语法与完整性规则
    always: true
    content: |
      subcomponents 块的每一行必须严格遵循以下格式（不可省略任何部分）：

        实例名 : 组件关键字 组件类型名.impl;

      格式拆解：
        - 实例名：自由命名，首字母小写或大写均可，但不能与 AADL 保留字冲突。
        - 组件关键字：必须是 AADL 标准关键字之一（system / process / thread / processor /
          memory / device / bus / data / subprogram / virtual processor），严禁使用
          subsystem、module、component 等非标准关键字。
        - 组件类型名.impl：必须引用已在 package 中声明过类型和实现的组件，后缀 .impl 不可省略。

      正确示例：
        subcomponents
          BrakeCtrl : system BrakeCtrl.impl;
          TempSensor : device TempSensor.impl;
          CanBus_1  : bus CanBus.impl;
          MainTask   : thread MainTask.impl;

      错误示例（这些是常见的出错模式，严禁出现）：
        -- 错误1：缺少 .impl 后缀
        BrakeCtrl : system BrakeCtrl;
        -- 错误2：使用了非标准关键字 subsystem
        BrakeSubsystem : subsystem BrakeSubsystem.impl;
        -- 错误3：缺少分号
        BrakeCtrl : system BrakeCtrl.impl
        -- 错误4：实例名与类型名混淆，把实例名写成了 .impl
        BrakeCtrl.impl : system BrakeCtrl.impl;
        -- 错误5：引用了未声明的组件（BrakeCtrl 在 package 中没有对应的 system 声明和 implementation）
        BrakeCtrl : system BrakeCtrl.impl;  -- 但 package 中没有 system BrakeCtrl ... end BrakeCtrl;

      完整性规则（每个 subcomponent 引用必须可追溯）：
      1. subcomponents 中引用的每一个组件，都必须在同一个 package 中有完整的"类型声明 + 实现声明"对。
         即：若 subcomponents 中出现 `Foo : system Foo.impl;`，则 package 中必须存在：
           system Foo
           end Foo;
           system implementation Foo.impl
           ...
           end Foo.impl;
      2. 严禁在 subcomponents 中引用只在类型声明而没有 implementation 的组件。
      3. 严禁在 subcomponents 中引用只在 implementation 而没有类型声明的组件。
      4. 实例名可以与类型名相同（如 `BrakeCtrl : system BrakeCtrl.impl;`），也可以不同（如
         `FrontBrake : system BrakeCtrl.impl;`），但类型名必须与已声明的组件类型名一致。

      组件包含关系表（父组件类型 -> 允许的子组件类型）：
        system implementation    -> system, process, processor, memory, device, bus, virtual processor, thread, data, subprogram, abstract
        processor implementation -> virtual processor, memory, bus（严禁包含 process！）
        process implementation   -> thread, data, subprogram
        thread implementation    -> data, subprogram（严禁包含 connections 块！）
        virtual processor impl   -> virtual processor, process（严禁包含 thread！线程只能放在 process 中）
        memory implementation    -> memory, bus
        bus implementation       -> （不允许包含任何子组件）
        device implementation    -> （不允许包含任何子组件）
        data implementation      -> data, subprogram
        subprogram implementation-> （不允许包含任何子组件）
        abstract implementation  -> system, process, processor, memory, device, bus, virtual processor, thread, data, subprogram, abstract

      包含关系规则：
      1. 严禁将 thread 直接放入 system implementation 的 subcomponents 中——thread 必须先放入
         process，再由 process 放入 system。
      2. 严禁将 process 直接放入 processor implementation 的 subcomponents 中——process 放在
         system implementation 的 subcomponents 中，processor 的 subcomponents 中只能放
         virtual processor、memory、bus。
      3. 严禁将 system 放入 process 或 thread 中——system 是顶层容器组件。
      4. bus、device、subprogram 的 implementation 中不允许声明任何 subcomponents，它们是叶子节点。
      5. 严禁将 thread 直接放入 virtual processor 的 subcomponents 中——线程只能作为 process 的
         子组件。virtual processor 的 subcomponents 中只能放 virtual processor 或 process。

  - id: properties_explanation
    title: properties 关键字用法说明
    always: true
    content: |
      AADL 中的 properties 关键字用于声明组件的属性值，约束组件的物理特性、运行时行为、资源需求等。

      基本语法：
        properties
          属性名 => 属性值;
          属性名 => 属性值 applies to 目标组件;
        end;

      常用属性（来自 AADL 标准属性集）：
        - Data_Size => N Bytes;          -- 数据大小（data 组件用）
        - Period => N Ms;                -- 周期（thread 用）
        - Compute_Execution_Time => N Ms .. M Ms;  -- 计算执行时间范围（thread 用）
        - Deadline => N Ms;              -- 截止时间（thread 用）
        - Priority => N;                 -- 优先级（thread 用）
        - Stack_Size => N Bytes;         -- 栈大小（thread 用）
        - Max_Queue_Size => N;           -- 最大队列长度（port 用）
        - Actual_Processor_Binding => reference (处理器名) applies to 软件组件;  -- 处理器绑定
        - Memory_Properties::RAM_Size => N Bytes;  -- 内存大小（memory 组件用，必须带属性集前缀）

      属性适用性表（严格匹配，不可跨类型使用）：
        - Data_Size：仅适用于 data 组件
        - Period / Compute_Execution_Time / Deadline / Priority / Stack_Size：仅适用于 thread 组件
        - Max_Queue_Size：仅适用于 event data port
        - Actual_Processor_Binding：将 thread/process 绑定到 processor
        - RAM_Size / Access_Time / Transfer_Rate：仅适用于 memory 组件，且必须带 Memory_Properties:: 前缀
        - Allowed_Connection_Binding：仅适用于连接绑定

      AADL 标准单位（严禁使用英文全拼）：
        数据大小：Bytes, Kbyte, Mbyte, Gbyte（严禁 Kilobytes, Megabytes）
        时间：ps, ns, us, ms, sec, min, hr（严禁 Second, Seconds, Millisecond）
        频率：Hz, KHz, MHz, GHz（严禁 Hertz）
        速率：per Second（用 AADL 标准时间单位，如 100 per sec）

      规则：
      1. properties 块可以出现在两个位置：
         a) 组件类型声明中（放在 features 之后、end 之前）——声明该类型所有实现共享的固有属性。
         b) 组件实现声明中（放在 subcomponents 之后、end 之前）——声明特定实现专属的属性。
      2. 每个属性声明以分号结尾。
      3. 需求中明确声明的数值约束（如"响应时间不超过10ms"、"单帧固定8字节"、"优先级为高"等）必须通过 properties 显式映射到 AADL 模型中，禁止遗漏。
      4. 当需求中未明确给出具体数值时，不生成 properties 块。
      5. 当属性值适用于该组件的所有实现时（如 thread 的 Period、Stack_Size、Compute_Execution_Time），应放在类型声明中而非实现声明中。
      6. 当属性值因实现不同而变化时（如 Data_Size 因 data 实现不同而不同），放在实现声明中。
      7. 严禁使用已废弃属性 Source_Data_Size 和 Destination_Data_Size，统一使用 Data_Size。
      8. 属性必须应用于其适用的组件类型，严禁跨类型使用（如 Data_Size 只能用于 data，不能用于 device/memory/processor）。
      9. 非标准属性集的属性必须带属性集前缀（如 Memory_Properties::RAM_Size），严禁直接写属性名。
      10. 数值与单位之间用空格分隔（如 10 Kbyte，不是 10Kbyte），单位使用 AADL 标准缩写。

  - id: connections
    title: 连接声明模板
    always: true
    content: |
      connections 块用于声明组件之间的连接关系，放在 system/process implementation 内部。

      【分层原则】
      - port 连接（数据端口连接，单向 ->）：用于软件组件之间的数据传输，可出现在 system 和 process implementation 中。
      - bus access 连接（总线访问连接，双向 <->）：仅用于 device/processor/memory 与 bus 之间的物理拓扑连接，只能出现在 system implementation 中，严禁出现在 process implementation 中。

      端口连接（单向数据流）：
        conn_name : port source_feature -> destination_feature;
        例：data_flow : port Sensor.out_data -> Processor.in_data;

      访问连接（双向共享访问）：
        conn_name : bus access source_feature <-> destination_feature;
        例：bus_conn : bus access Device.powerIn <-> PowerBus.powerOut;

      连接内联属性（在连接声明末尾用花括号附加属性）：
        conn_name : port source_feature -> destination_feature {属性名 => 属性值;};
        例：current_temperature : port temperature_sensor.current_temperature -> thermostat.current_temperature {latency => 2ms..4ms;};
        例：heat_control : port thermostat.heat_control -> heat_source.heat_control {latency => 5ms..6ms;};

      规则：
      1. port 连接方向用 ->（单向），access 连接方向用 <->（双向）。
      2. bus access 连接严禁使用 <> 或 ->，必须使用 <->。
      3. 连接的两端必须是 features 中已声明的端口或访问点名称。生成每条连接前，必须逐一核对：引用的 实例名.端口名 中，端口名是否确实存在于该实例对应组件类型的 features 块中。如果该组件类型没有 features 块或 features 块中没有该端口，则严禁生成此连接。
      4. connections 块放在 implementation 的 subcomponents 之后、properties 之前。
      5. 当需求中明确给出连接的延迟、带宽等约束时，使用连接内联属性 {属性名 => 值;} 附加在连接声明末尾。
      6. 常用连接内联属性：latency（延迟范围，如 latency => 2ms..4ms;）、Timing（时序）。
      7. 内联属性以分号结尾，整体用花括号包裹，紧跟在连接声明的分号位置之前。
      8. 连接中引用的实例名必须是当前 implementation 的 subcomponents 中已声明的子组件实例名，严禁引用未在当前 implementation 中实例化的组件。

  - id: flows
    title: 流声明模板
    trigger:
      anyKeywords: ["流", "flow", "端到端", "数据流路径", "flow path", "flow source", "flow sink", "end to end flow"]
    content: |
      flows 块用于声明组件的端到端数据流路径，放在组件类型声明的 features 之后。

      三种流声明类型：
        1. flow source（流源）：数据从该组件产生向外输出
           流名 : flow source out_port_name;
           例：current_temperature_flow : flow source current_temperature;

        2. flow sink（流汇）：数据从外部流入该组件终止
           流名 : flow sink in_port_name;
           例：heat_control_flow : flow sink heat_control;

        3. flow path（流路径）：数据穿过该组件，从输入端口到输出端口
           流名 : flow path in_port_name -> out_port_name;
           例：current_temperature_flow : flow path current_temperature -> heat_control;

      end to end flow（端到端流，在 implementation 的 flows 块中声明）：
        流名 : end to end flow 组件A.流A -> 连接名 -> 组件B.流B -> 连接名 -> 组件C.流C {属性};
        例：path1 : end to end flow temperature_sensor.current_temperature_flow -> current_temperature -> thermostat.current_temperature_flow -> heat_control -> heat_source.heat_control_flow {latency => 5ms..9ms;};

      语法说明：
      1. flow source/sink/path 声明在组件类型声明（system/device 等）的 features 之后，与 features 平级。
      2. end to end flow 声明在 implementation 的 flows 块中，引用子组件的流和 connections 中的连接名。
      3. end to end flow 通过 "-> 连接名 ->" 将各子组件的流串联起来。

      规则：
      1. 只有需求中明确描述"数据流路径、端到端流、数据流向"等内容时，才生成 flows 块。
      2. flow source 用于数据产生者（如传感器），flow sink 用于数据消费者（如执行器），flow path 用于数据中转者（如控制器）。
      3. end to end flow 中引用的流名必须在对应子组件的类型声明中已定义，引用的连接名必须在 connections 块中已声明。
      4. end to end flow 可以携带内联属性（如 latency），格式与连接内联属性一致。
      5. flows 块在 implementation 中放在 connections 之后、properties 之前。

order:
  content: |
    生成顺序：
    1. package
    2. 顶层 system 及 implementation
    3. 系统管理器 device 及 implementation
    4. 系统模块 system 及 implementation
    5. 模块管理器 device 及 implementation
    6. 各 system 子系统及 implementation
    7. 各 process 软件分区及 implementation
    8. 各 thread 任务及 implementation
    9. 网络接口 device 及 implementation
    10. processor 及 processor implementation
    11. virtual processor 声明及 implementation
    12. memory 及 implementation
    13. 子 memory 声明及 implementation
    14. 外部 device 声明及 implementation
    15. bus 声明及 implementation
    16. data 声明及 implementation
    17. subprogram 声明及 implementation
    18. annex EMV2 错误行为模型（如有）
    19. end package

forbidden:
  content: |
    禁止规则（以下为全局规则之外的补充禁止项，全局规则中已声明的不再重复）：
    1. 如果需求中总线为 0，则不要生成 bus。
    2. 严禁在 processor、memory、device 等物理硬件的 subcomponents 中直接嵌套 process、thread 等软件组件。
    3. 严禁忽略需求中明确声明的数据大小约束（如"固定占用8字节"）。凡有字节大小描述的数据组件，必须在 data implementation 的 properties 中声明 Data_Size。
    4. 严禁用 in/out 端口访问总线！device/processor/memory 等组件访问总线时，必须在 features 块中使用 requires bus access 声明（如 requires bus access CanBus;），不得用 in data port / out data port 代替。
    5. 严禁在 bus access 连接中使用 <> 或 ->，必须使用 <->。
    6. 严禁使用已废弃属性 Source_Data_Size 和 Destination_Data_Size，必须使用 Data_Size 替代。
    7. 严禁跨组件类型使用属性：Data_Size 仅用于 data 组件；Period/Deadline/Priority/Stack_Size/Compute_Execution_Time 仅用于 thread；RAM_Size 仅用于 memory。不得将 thread 属性用于 device/system/processor，也不得将 data 属性用于非 data 组件。
    8. 严禁使用英文全拼单位（Kilobytes, Megabytes, Second, Seconds, Millisecond, Hertz），必须使用 AADL 标准缩写（Kbyte, Mbyte, sec, ms, Hz）。
    9. 严禁直接使用非标准属性名而不带属性集前缀，如直接写 Max_Capacity 或 per。必须带属性集前缀（如 Memory_Properties::Max_Capacity）。
    10. 严禁在属性值中出现语法错误：数值与单位之间必须有空格（10 Kbyte），范围用 .. 连接（5 ms .. 10 ms），列表用括号包裹（("Ok", "Error")）。
    11. 严禁在 subcomponents 中使用非标准组件关键字（subsystem、module、component 等），必须使用 AADL 标准关键字（system、process、thread、processor、memory、device、bus、data、subprogram、virtual processor）。
    12. 严禁在 subcomponents 中引用未在 package 中声明类型和实现的组件——每个 subcomponent 引用都必须有对应的"类型声明 + 实现声明"对存在于同一个 package 中。
    13. 严禁在 subcomponents 行中省略 .impl 后缀或省略末尾分号。
    14. 严禁在 thread implementation 中编写 connections 块！线程内部只能包含 properties，不能包含 connections、subcomponents。组件之间的连接只能写在 system 或 process 的 implementation 中。
    15. 严禁使用 requires data port 语法！requires 关键字只能用于 bus access / subprogram access。数据端口必须明确方向：in data port（输入）或 out data port（输出）。
    16. 严禁在 properties 中使用 applies to 引用未在当前 implementation 的 subcomponents 中声明的实例。applies to 的目标必须是当前 implementation 中已实例化的子组件名。
    17. 严禁在 virtual processor 的 subcomponents 中直接包含 thread！虚拟处理器只能包含其他虚拟处理器或进程。线程只能作为 process 的子组件。
    18. 严禁截断连接行：每条连接声明必须完整写出两端端口引用并以分号结尾。严禁出现 `Instance.` 后面缺少端口名的情况。
    19. 严禁在 process implementation 中编写 bus access 连接！bus access 连接只能出现在 system implementation 中。进程内部只做纯粹的 port 数据流连接，总线访问在顶层 system 中统一处理。
    20. 严禁滥用 bus access 代替 port 连接！软件组件之间的数据交互必须使用 port（单向 ->），不得用 bus access（双向 <->）。bus access 仅用于 device/processor/memory 与 bus 之间的物理拓扑连接。
    21. 严禁打乱 implementation 内部块的顺序：必须按 subcomponents → connections → properties 的顺序编写，不得颠倒或交叉。

example:
  title: AADL生成示例
  description: 以下是一个完整的AADL模型示例，请参考其格式生成代码
  content: |
    package OS_Arch 
    public 

    -- ======================================= 
    -- 1. EMV2 错误模型库声明（修正：直接定义在 annex 块内）
    -- ======================================= 
    annex EMV2 {**
      error behavior ThreeErrorStates
        events
          BadValueEvent  : error event;
          NoValueEvent   : error event;
          LateValueEvent : error event;
        states
          Operational    : initial state;
          BadValueState  : state;
          NoValueState   : state;
          LateValueState : state;
        transitions
          BadValueTransition : Operational -[BadValueEvent]-> BadValueState;
          NoValueTransition  : Operational -[NoValueEvent]-> NoValueState;
          LateTransition     : Operational -[LateValueEvent]-> LateValueState;
      end behavior;
    **};

    -- ======================================= 
    -- 2. 顶层系统容器 
    -- ======================================= 
    system Top_System 
    end Top_System; 

    system implementation Top_System.impl 
      subcomponents 
        MainProcessor      : processor MainProcessor.impl; 
        RAM                : memory RAM.impl; 
        Flash              : memory Flash.impl; 
        SerialPort         : device SerialPort.impl; 
        CANController      : device CANController.impl; 
        EthernetController : device EthernetController.impl; 
        HardwareTimer      : device HardwareTimer.impl; 
        WatchdogTimer      : device WatchdogTimer.impl; 
        CanBus_1           : bus CanBus.impl;
        KernelProcess      : process KernelProcess.impl; 
      connections 
        data_flow : port SerialPort.out_data -> KernelProcess.in_data;
        bus_conn  : bus access CANController.canIn <-> CanBus_1.busOut;
      properties 
        Actual_Processor_Binding => (reference (MainProcessor)) applies to KernelProcess; 
    end Top_System.impl; 

    -- ======================================= 
    -- 3. 软件组件定义 
    -- ======================================= 
    process KernelProcess 
      features
        in_data : in data port SerialData;
    end KernelProcess; 

    process implementation KernelProcess.impl 
      subcomponents 
        TaskScheduler        : thread TaskScheduler.impl; 
        TimerManager         : thread TimerManager.impl; 
        InterruptHandler     : thread InterruptHandler.impl; 
        MemoryManager        : thread MemoryManager.impl; 
        CommunicationManager : thread CommunicationManager.impl; 
