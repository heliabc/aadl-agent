[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "aadl-single-agent"
version = "0.2.0"
description = "Single-agent AADL generation with forward-reference-aware joint constraints"
requires-python = ">=3.11,<3.14"
dependencies = ["httpx>=0.28,<1", "PyYAML>=6,<7", "jsonschema>=4.23,<5", "llguidance==1.9.1"]

[project.optional-dependencies]
server = ["torch==2.6.0", "transformers==4.51.3", "outlines==1.2.6", "fastapi==0.115.12", "uvicorn==0.34.0", "accelerate>=1.0", "sentencepiece>=0.2", "protobuf>=4"]

[project.scripts]
aadl-single-agent = "aadl_single_agent.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/aadl_single_agent"]

[tool.hatch.build.targets.wheel.force-include]
"resources" = "aadl_single_agent/_resources"

